<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>Anfrage-Assistent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-banner" role="note">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/></svg>
    <span>Demo – es werden keine Daten versendet</span>
  </div>

  <header class="site-header">
    <div class="container brand">
      <span class="brand-logo" id="brand-logo" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name" id="brand-name"></span>
        <span class="brand-tagline" id="brand-tagline"></span>
      </span>
    </div>
  </header>

  <form id="wizard" class="wizard" novalidate autocomplete="on">
    <main class="container main">
      <div class="progress" id="progress">
        <div class="progress-meta">
          <span id="progress-label">Schritt 1 von 6</span>
          <span id="progress-name" class="progress-name"></span>
        </div>
        <div class="progress-track" id="progress-bar" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="6" aria-valuenow="1">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div id="step-root" class="step"></div>

      <noscript>
        <p class="noscript">Bitte aktivieren Sie JavaScript, um den Anfrage-Assistenten zu nutzen.</p>
      </noscript>
    </main>

    <nav class="action-bar" id="action-bar" aria-label="Navigation">
      <div class="container">
        <button type="button" class="bar-msg" id="bar-msg" hidden></button>
      </div>
      <div class="container action-inner">
        <button type="button" class="btn btn-secondary btn-back" id="btn-back">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          <span>Zurück</span>
        </button>
        <button type="submit" class="btn btn-primary btn-next" id="btn-next">
          <span class="btn-label">Weiter</span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </nav>
  </form>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
